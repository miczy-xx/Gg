<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="#334155" stroke-width="4"/>

  <!-- Tech Grid Accent Lines -->
  <path d="M64 128 H448 M64 256 H448 M64 384 H448" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8"/>
  <path d="M128 64 V448 M256 64 V448 M384 64 V448" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 8"/>

  <!-- Parallel Layers Hologram -->
  <polygon points="256,96 384,168 256,240 128,168" fill="#38bdf8" fill-opacity="0.18" stroke="#38bdf8" stroke-width="4"/>
  <polygon points="256,160 384,232 256,304 128,232" fill="#818cf8" fill-opacity="0.25" stroke="#818cf8" stroke-width="4"/>
  <polygon points="256,224 384,296 256,368 128,296" fill="#ef4444" fill-opacity="0.35" stroke="#ef4444" stroke-width="4"/>

  <!-- Central Target Crosshair -->
  <circle cx="256" cy="256" r="88" fill="none" stroke="#ef4444" stroke-width="5" stroke-opacity="0.9" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="48" fill="none" stroke="#f97316" stroke-width="3" stroke-dasharray="12 6"/>
  <line x1="256" y1="140" x2="256" y2="190" stroke="#f87171" stroke-width="5" stroke-linecap="round"/>
  <line x1="256" y1="322" x2="256" y2="372" stroke="#f87171" stroke-width="5" stroke-linecap="round"/>
  <line x1="140" y1="256" x2="190" y2="256" stroke="#f87171" stroke-width="5" stroke-linecap="round"/>
  <line x1="322" y1="256" x2="372" y2="256" stroke="#f87171" stroke-width="5" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="10" fill="#facc15"/>

  <!-- 120 FPS Badge at Bottom -->
  <rect x="146" y="388" width="220" height="52" rx="14" fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="3.5" filter="url(#glow)"/>
  <text x="256" y="424" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="2">
    120 <tspan fill="#ef4444">FPS</tspan>
  </text>

  <!-- Garena Shield Corner Badge -->
  <path d="M374 72 L440 72 L440 128 C440 160 410 184 374 196 C338 184 308 160 308 128 L308 72 Z" fill="#ef4444" fill-opacity="0.9"/>
  <text x="374" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="800" fill="#ffffff" text-anchor="middle">
    G
  </text>
</svg>
